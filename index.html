<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኬኖ እና ቢንጎ ጨዋታ</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        h1 { margin-bottom: 30px; color: #38bdf8; }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 300px;
            margin: 0 auto;
        }
        .game-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .game-btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <h1>🎮 እንኳን ደህና መጡ! 🎯</h1>
    <p style="margin-bottom: 40px; color: #94a3b8;">መጫወት የሚፈልጉትን ጨዋታ ይምረጡ፦</p>
    
    <div class="btn-container">
        <a href="keno.html" class="game-btn">ኬኖ ጨዋታ (Keno)</a>
        <a href="bingo.html" class="game-btn">ቢንጎ ጨዋታ (Bingo)</a>
    </div>
</body>
</html>
